services:
  - type: web
    name: tourist-trip-planner
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_GATEWAY_MODE
        value: test
